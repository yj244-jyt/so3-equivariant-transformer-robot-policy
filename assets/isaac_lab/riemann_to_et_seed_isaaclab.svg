<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111c31"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f766e"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c2410c"/><stop offset="1" stop-color="#fb923c"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#8bd5ff"/></marker>
    <style>
      .title{font:700 38px Inter,Arial,sans-serif;fill:#f8fafc}.subtitle{font:400 20px Inter,Arial,sans-serif;fill:#b7c7dc}.label{font:700 24px Inter,Arial,sans-serif;fill:#f8fafc}.body{font:400 18px Inter,Arial,sans-serif;fill:#dbeafe}.small{font:400 16px Inter,Arial,sans-serif;fill:#a7b7cf}.mono{font:600 17px 'JetBrains Mono',monospace;fill:#d1fae5}.box{stroke:#334b70;stroke-width:2}.chip{font:600 16px Inter,Arial,sans-serif;fill:#08111f}.note{font:600 18px Inter,Arial,sans-serif;fill:#fef3c7}
    </style>
  </defs>
  <rect width="1800" height="980" fill="url(#bg)"/>
  <text x="70" y="72" class="title">Isaac Lab × ET-SEED：将 RiEMann 点云策略嵌入轨迹扩散</text>
  <text x="70" y="108" class="subtitle">设计稿：保持 ET-SEED 的轨迹级 SE(3) 扩散训练接口，只替换视觉几何编码器与动作条件分支</text>

  <rect x="70" y="155" rx="22" width="360" height="290" fill="#14243d" class="box" filter="url(#shadow)"/>
  <text x="100" y="202" class="label">① Isaac Lab 场景</text>
  <text x="100" y="240" class="body">Franka / Allegro · rack · mug</text>
  <text x="100" y="274" class="body">多相机 RGB-D + 关节状态</text>
  <rect x="100" y="306" rx="10" width="280" height="54" fill="#203b62"/><text x="122" y="340" class="mono">SE(3) 随机场景与物理接触</text>
  <rect x="100" y="378" rx="10" width="280" height="42" fill="#1d334f"/><text x="122" y="406" class="small">ManagerBasedEnv / PhysX / RTX</text>

  <path d="M430 300 C500 300 505 300 570 300" fill="none" stroke="#8bd5ff" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="463" y="274" class="small">raw observation</text>

  <rect x="570" y="155" rx="22" width="380" height="290" fill="#102f3b" class="box" filter="url(#shadow)"/>
  <text x="600" y="202" class="label">② 几何输入适配</text>
  <text x="600" y="240" class="body">相机标定 → 融合 XYZRGB 点云</text>
  <text x="600" y="274" class="body">对象 mask / ROI 只用于训练协议</text>
  <rect x="600" y="306" rx="10" width="300" height="54" fill="#165e68"/><text x="620" y="340" class="mono">N × (x, y, z, r, g, b)</text>
  <rect x="600" y="378" rx="10" width="300" height="42" fill="#164854"/><text x="620" y="406" class="small">same scene manifest · same controller</text>

  <path d="M950 300 C1015 300 1020 300 1080 300" fill="none" stroke="#8bd5ff" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="971" y="274" class="small">point tokens</text>

  <rect x="1080" y="155" rx="22" width="330" height="290" fill="#18304a" class="box" filter="url(#shadow)"/>
  <text x="1110" y="202" class="label">③ RiEMann encoder</text>
  <rect x="1110" y="228" rx="10" width="270" height="50" fill="url(#blue)"/><text x="1130" y="261" class="chip">φ：saliency / ROI center</text>
  <rect x="1110" y="292" rx="10" width="270" height="50" fill="url(#green)"/><text x="1130" y="325" class="chip">ψ：SE(3) pose features</text>
  <text x="1110" y="382" class="body">B0 / M2 / M2wide / isomorphic</text>
  <text x="1110" y="414" class="small">SO(3) irreps + local attention</text>

  <path d="M1410 300 C1470 300 1478 300 1535 300" fill="none" stroke="#8bd5ff" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1430" y="274" class="small">equivariant condition</text>

  <rect x="1535" y="155" rx="22" width="195" height="290" fill="#3a251d" class="box" filter="url(#shadow)"/>
  <text x="1565" y="202" class="label">④ ET-SEED</text>
  <text x="1565" y="242" class="body">SE(3) trajectory</text>
  <text x="1565" y="274" class="body">diffusion head</text>
  <rect x="1565" y="310" rx="10" width="135" height="48" fill="url(#orange)"/><text x="1584" y="341" class="chip">A₀:K</text>
  <text x="1565" y="398" class="small">one equivariant</text>
  <text x="1565" y="421" class="small">transition + invariant</text>

  <rect x="70" y="520" rx="22" width="1660" height="350" fill="#0d1728" stroke="#334b70" stroke-width="2"/>
  <text x="105" y="570" class="label">替换边界与训练对照</text>
  <line x1="105" y1="600" x2="1695" y2="600" stroke="#334b70"/>
  <text x="115" y="642" class="body">ET-SEED 保留</text><text x="440" y="642" class="body">轨迹级 SE(3) action 表示、扩散时间表、denoising loss、rollout 与 success predicate</text>
  <text x="115" y="690" class="body">RiEMann 替换</text><text x="440" y="690" class="body">object point-cloud encoder、φ→ROI→ψ 条件分支、IMGS rotation decoder</text>
  <text x="115" y="738" class="body">Isaac Lab 新增</text><text x="440" y="738" class="body">多相机传感器、GPU 并行场景、接触/摩擦参数、episode manifest 与视频审计</text>
  <text x="115" y="786" class="body">首轮消融</text><text x="440" y="786" class="body">ET-SEED 原视觉 backbone → RiEMann B0 → M2 → M2wide；冻结 demonstrations、action horizon、seed</text>
  <rect x="105" y="812" rx="10" width="1590" height="38" fill="#4a3514"/><text x="130" y="838" class="note">门禁：先在 T 校准与 held-out replay 达标，再报告 NP / NI / DO / ALL；仿真成功率与真实机器人结果分开记录。</text>
</svg>
